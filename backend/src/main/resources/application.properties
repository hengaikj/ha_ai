server.port=${SERVER_PORT:18080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ha_ai?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:ha_ai}
spring.datasource.password=${DB_PASSWORD:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
mybatis-plus.mapper-locations=classpath:/mapper/*.xml
app.auth.jwt.hmac-key=${AUTH_JWT_HMAC_KEY:}
app.auth.jwt.issuer=${AUTH_JWT_ISSUER:https://ha-ai.local}
app.auth.jwt.ttl-seconds=${AUTH_JWT_TTL_SECONDS:3600}
