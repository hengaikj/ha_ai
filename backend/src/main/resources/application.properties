spring.application.name=ha-gateway
spring.datasource.url=${HA_MYSQL_URL:jdbc:mysql://localhost:13306/ha_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${HA_MYSQL_USERNAME:root}
spring.datasource.password=${HA_MYSQL_PASSWORD:dev_only_change_me}
spring.data.redis.host=${HA_REDIS_HOST:localhost}
spring.data.redis.port=${HA_REDIS_PORT:16379}
ha.gateway.persistence.enabled=${HA_GATEWAY_PERSISTENCE_ENABLED:false}
ha.gateway.redis.namespace=${HA_REDIS_NAMESPACE:ha:dev:}
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
spring.flyway.enabled=${HA_FLYWAY_ENABLED:false}
ha.provider.hengai.base-url=${HA_HENGAI_BASE_URL:https://api.hengaikj.com/v1}
ha.provider.hengai.api-key=${HA_HENGAI_API_KEY:}
