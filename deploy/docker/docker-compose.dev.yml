services:
  mysql:
    image: mysql:8.4
    container_name: ha-ai-mysql
    environment:
      MYSQL_DATABASE: ha_ai
      MYSQL_ROOT_PASSWORD: ${HA_MYSQL_ROOT_PASSWORD:-dev_only_change_me}
    ports:
      - "${HA_MYSQL_PORT:-3306}:3306"
    volumes:
      - ha_mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_0900_ai_ci"]

  redis:
    image: redis:7.4-alpine
    container_name: ha-ai-redis
    ports:
      - "${HA_REDIS_PORT:-6379}:6379"
    volumes:
      - ha_redis_data:/data

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: ha-ai-backend
    depends_on:
      - mysql
      - redis
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ha_ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ${HA_MYSQL_ROOT_PASSWORD:-dev_only_change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLYWAY_ENABLED: "true"
      SERVER_PORT: 8080
      AUTH_JWT_HMAC_KEY: ${AUTH_JWT_HMAC_KEY:?请在本地.env中设置至少32字节的JWT签名密钥}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://ha-ai.local}
      AUTH_JWT_TTL_SECONDS: ${AUTH_JWT_TTL_SECONDS:-3600}
      AUTH_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:?请在本地.env中设置初始管理员用户名}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:?请在本地.env中设置至少12位初始管理员密码}
      HENGAI_BASE_URL: ${HENGAI_BASE_URL:-https://api.hengaikj.com/v1}
    ports:
      - "${HA_BACKEND_PORT:-18080}:8080"

volumes:
  ha_mysql_data:
  ha_redis_data:
