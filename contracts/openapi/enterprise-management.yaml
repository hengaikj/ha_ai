components:
  schemas:
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        code:
          type: string
          description: 可选验证码；当前验证码关闭时忽略
        uuid:
          type: string
          description: 可选验证码标识；当前验证码关闭时忽略
    LoginResponse:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
        data:
          type: object
          required:
          - accessToken
          - expiresIn
          properties:
            accessToken:
              type: string
              description: Bearer JWT；客户端应存储于登录会话中
            expiresIn:
              type: integer
              format: int64
              example: 3600
    AuthEnvelope:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
        data:
          nullable: true
    AuthError:
      type: object
      properties:
        code:
          type: integer
          example: 401
        msg:
          type: string
          example: 用户名或密码错误
    CurrentUserResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/CurrentUserContext'
            roles:
              type: array
              items:
                type: string
            permissions:
              type: array
              description: 第一版为空；授权由后端角色和资源范围执行，不定义新的 permission code。
              items:
                type: string
    CurrentUserContext:
      type: object
      required:
      - userId
      - username
      - displayName
      - roleCodes
      - permissionCodes
      - projectIds
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        enterpriseId:
          type: integer
          format: int64
          nullable: true
          description: 普通用户所属企业；platform-admin 为 null
        roleCodes:
          type: array
          items:
            type: string
        permissionCodes:
          type: array
          description: 保留前端兼容字段；第一版不新增 permission code。
          items:
            type: string
        projectIds:
          type: array
          items:
            type: integer
            format: int64
    RouterResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              name:
                type: string
              component:
                type: string
              meta:
                type: object
                additionalProperties: true
    CaptchaResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
        captchaEnabled:
          type: boolean
          example: false
        img:
          type: string
          description: 验证码关闭时为空
        uuid:
          type: string
          description: 验证码关闭时为空
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - message
          - type
          - code
          properties:
            message:
              type: string
              description: 面向调用方的错误说明
            type:
              type: string
              description: 错误类型
            code:
              type: string
              description: 平台规范化错误码
    Money:
      type: string
      pattern: ^-?\d+(\.\d{1,12})?$
      description: 权威金额字符串，最多12位小数；数据库DECIMAL(24,12)，Java BigDecimal
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          description: 当前页码
        pageSize:
          type: integer
          description: 每页条数
        total:
          type: integer
          format: int64
          description: 总记录数
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: 是否成功
        requestId:
          type: string
          description: 管理API请求追踪ID
        data:
          description: 业务响应数据
    ProjectSummary:
      type: object
      properties:
        projectId:
          type: string
          description: 项目ID
        projectCode:
          type: string
          description: 企业内唯一项目编码
        projectName:
          type: string
          description: 项目名称
        entitlementMode:
          type: string
          enum:
          - BALANCE
          - SUBSCRIPTION
          description: 项目唯一权益模式
        status:
          type: string
          description: 项目状态
    ApiKeySummary:
      type: object
      properties:
        apiKeyId:
          type: string
          description: API Key ID
        keyName:
          type: string
          description: Key名称
        keyPrefix:
          type: string
          description: 脱敏展示前缀，不是完整Secret
        status:
          type: string
          enum:
          - ENABLED
          - DISABLED
          - REVOKED
          description: Key状态
        createdAt:
          type: string
          format: date-time
          description: Key创建时间
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 可选过期时间
    UsageSummary:
      type: object
      properties:
        requestId:
          type: string
          description: AI调用请求ID
        projectId:
          type: string
          description: 项目ID
        model:
          type: string
          description: 逻辑模型编码
        executionResult:
          type: string
          description: 执行结果
        deliveryResult:
          type: string
          description: 交付结果
        billingResult:
          type: string
          description: 计费结果
        createdAt:
          type: string
          format: date-time
          description: 请求时间
    BillingSummary:
      type: object
