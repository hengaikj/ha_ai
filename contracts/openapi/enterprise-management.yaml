openapi: 3.0.3
info:
  title: 恒爱AI聚合平台 企业管理 API
  version: 1.0.0-candidate
  description: 企业管理员、项目管理员、开发成员及财务/审计查看者使用的管理接口候选契约。所有资源必须同时校验Enterprise、Membership、Role和Project Scope。
paths:
  /api/projects:
    get:
      summary: 查询项目列表
      description: 权限：企业管理员；项目管理员/开发成员按授权项目范围。必须执行企业租户与项目数据范围校验。
      responses:
        '200':
          description: 通用成功响应
          headers:
            x-request-id:
              description: 管理API请求追踪ID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: 请求参数或状态不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权限或租户/项目数据范围越权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录或认证失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 资源状态冲突、重复业务键或并发版本冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 平台内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: 创建项目
      description: 权限：企业管理员。必须执行企业租户与项目数据范围校验。
      responses:
        '200':
          description: 通用成功响应
          headers:
            x-request-id:
              description: 管理API请求追踪ID
