openapi: 3.0.3
info:
  title: 恒爱AI聚合平台 企业管理 API
  version: 1.0.0-candidate
  description: 企业管理员、项目管理员、开发成员及财务/审计查看者使用的管理接口候选契约。所有资源必须同时校验Enterprise、Membership、Role和Project Scope。
paths:
  /login:
    post:
      summary: 用户登录
      description: 使用用户名与密码登录；验证码当前关闭，code 和 uuid 可省略。用户名不存在、密码错误或账号锁定统一返回相同的认证失败响应。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功并签发一个小时有效的 Bearer JWT
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 请求字段不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 统一认证失败，不区分用户名、密码或账号状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /logout:
    post:
      summary: 注销当前会话
      description: 撤销当前 JWT 对应的服务端会话；注销后该 JWT 返回 401。
      responses:
        '200':
          description: 会话已注销
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '401':
          description: 未登录或会话已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /getInfo:
    get:
      summary: 查询当前登录用户上下文
      responses:
        '200':
          description: 用户、角色和兼容权限码上下文
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: 未登录或会话已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /getRouters:
    get:
      summary: 查询当前用户可访问的前端菜单
      responses:
        '200':
          description: 当前用户可访问的路由菜单
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterResponse'
        '401':
          description: 未登录或会话已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /api/captchaImage:
    get:
      summary: 查询验证码开关状态
      description: 当前开发环境验证码关闭，响应 captchaEnabled=false；此接口不要求用户身份。
      security: []
      responses:
        '200':
          description: 验证码配置
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaResponse'
  /api/projects:
    get:
      summary: 查询项目列表
      description: 权限：企业管理员；项目管理员/开发成员按授权项目范围。必须执行企业租户与项目数据范围校验。
      responses:
        '200':
          description: 通用成功响应
          headers:
            x-request-id:
              description: 管理API请求追踪ID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: 请求参数或状态不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权限或租户/项目数据范围越权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录或认证失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 资源状态冲突、重复业务键或并发版本冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 平台内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: 创建项目
      description: 权限：企业管理员。必须执行企业租户与项目数据范围校验。
