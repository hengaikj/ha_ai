components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - message
          - type
          - code
          properties:
            message:
              type: string
              description: 面向调用方的错误说明
            type:
              type: string
              description: 错误类型
            code:
              type: string
              description: 平台规范化错误码
    Money:
      type: string
      pattern: ^-?\d+(\.\d{1,12})?$
      description: 权威金额字符串，最多12位小数；数据库DECIMAL(24,12)，Java BigDecimal
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          description: 当前页码
        pageSize:
          type: integer
          description: 每页条数
        total:
          type: integer
          format: int64
          description: 总记录数
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: 是否成功
        requestId:
          type: string
          description: 管理API请求追踪ID
        data:
          description: 业务响应数据
    ProjectSummary:
      type: object
      properties:
        projectId:
          type: string
          description: 项目ID
        projectCode:
          type: string
          description: 企业内唯一项目编码
        projectName:
          type: string
          description: 项目名称
        entitlementMode:
          type: string
          enum:
          - BALANCE
          - SUBSCRIPTION
          description: 项目唯一权益模式
        status:
          type: string
          description: 项目状态
    ApiKeySummary:
      type: object
      properties:
        apiKeyId:
          type: string
          description: API Key ID
        keyName:
          type: string
          description: Key名称
        keyPrefix:
          type: string
          description: 脱敏展示前缀，不是完整Secret
        status:
          type: string
          enum:
          - ENABLED
          - DISABLED
          - REVOKED
          description: Key状态
        createdAt:
          type: string
          format: date-time
          description: Key创建时间
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 可选过期时间
    UsageSummary:
      type: object
      properties:
        requestId:
          type: string
          description: AI调用请求ID
        projectId:
          type: string
          description: 项目ID
        model:
          type: string
          description: 逻辑模型编码
        executionResult:
          type: string
          description: 执行结果
        deliveryResult:
          type: string
          description: 交付结果
        billingResult:
          type: string
          description: 计费结果
        createdAt:
          type: string
          format: date-time
          description: 请求时间
    BillingSummary:
      type: object
      properties:
        settlementId:
          type: string
          description: 结算ID
        requestId:
          type: string
          description: 关联AI调用请求ID
        totalCharge:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          description: 币种
        status:
          type: string
          description: 结算状态
  securitySchemes:
    HumanAuth:
      type: http
      scheme: bearer
      bearerFormat: Session/JWT
      description: 企业人员管理后台登录凭证
security:
- HumanAuth: []
