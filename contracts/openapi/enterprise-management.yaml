              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectCode:
                  type: string
                  description: 企业内唯一项目编码
                projectName:
                  type: string
                  description: 项目名称
                entitlementMode:
                  type: string
                  enum:
                  - BALANCE
                  - SUBSCRIPTION
