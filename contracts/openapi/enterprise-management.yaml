                  description: 项目名称
                entitlementMode:
                  type: string
                  enum:
                  - BALANCE
                  - SUBSCRIPTION
                  description: 项目唯一权益模式
                enterpriseId:
                  type: string
                  description: 仅 platform-admin 可指定目标企业；其他角色不得提交该字段。platform-admin 创建项目时必填。
