openapi: 3.0.3
info:
  title: 恒爱AI聚合平台 平台运营 API
  version: 1.0.0-candidate
  description: 平台运营人员使用的企业、模型、Provider、Channel、路由、价格、支付、人工入账、计费审计接口。Provider Credential不得通过普通查询接口返回明文。
security:
- PlatformAuth: []
paths:
  /api/platform/enterprises:
    get:
      summary: 查询企业
      description: 平台权限：Enterprise Operator。敏感凭证按最小权限原则处理。
      responses:
        '200':
          description: 成功
          headers:
            x-request-id:
              description: 管理API请求追踪ID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: 请求参数或状态不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权限或租户/项目数据范围越权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录或认证失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 资源状态冲突、重复业务键或并发版本冲突
