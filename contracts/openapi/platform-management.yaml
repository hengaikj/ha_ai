      summary: 查询企业
      description: 平台权限：Enterprise Operator。敏感凭证按最小权限原则处理。
      responses:
        '200':
          description: 成功
          headers:
            x-request-id:
              description: 管理API请求追踪ID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: 请求参数或状态不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权限或租户/项目数据范围越权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 资源不存在
