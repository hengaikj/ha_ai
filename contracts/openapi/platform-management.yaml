components:
  securitySchemes:
    PlatformAuth:
      type: http
      scheme: bearer
      bearerFormat: Session/JWT
      description: 平台运营人员登录凭证
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - message
          - type
          - code
          properties:
            message:
              type: string
              description: 面向调用方的错误说明
            type:
              type: string
              description: 错误类型
            code:
              type: string
              description: 平台规范化错误码
    Money:
      type: string
      pattern: ^-?\d+(\.\d{1,12})?$
      description: 权威金额字符串，最多12位小数；数据库DECIMAL(24,12)，Java BigDecimal
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          description: 当前页码
        pageSize:
          type: integer
          description: 每页条数
        total:
          type: integer
          format: int64
          description: 总记录数
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: 是否成功
        requestId:
          type: string
          description: 管理API请求追踪ID
        data:
          description: 业务响应数据
    LogicalModelRequest:
      type: object
      required:
      - modelCode
      - modelName
      properties:
        modelCode:
          type: string
          minLength: 1
          maxLength: 128
          description: 对企业暴露的逻辑模型编码，创建后保持稳定
        modelName:
          type: string
          minLength: 1
          maxLength: 128
          description: 逻辑模型展示名称
        capabilities:
          type: object
          additionalProperties: true
          description: 模型能力元数据；未提供时由平台按默认能力处理
        status:
          type: string
          enum: [ENABLED, DISABLED]
          default: ENABLED
          description: 逻辑模型状态
    LogicalModel:
      type: object
      required: [logicalModelId, modelCode, modelName, status, createdAt, updatedAt]
      properties:
        logicalModelId:
          type: string
          description: 逻辑模型ID
        modelCode:
          type: string
          description: 对企业暴露的逻辑模型编码
        modelName:
          type: string
          description: 逻辑模型名称
        capabilities:
          type: object
          additionalProperties: true
          description: 模型能力元数据
        status:
          type: string
          enum: [ENABLED, DISABLED]
          description: 逻辑模型状态
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        updatedAt:
          type: string
          format: date-time
          description: 更新时间
    LogicalModelResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/LogicalModel'
    LogicalModelListResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/LogicalModel'
    ProviderRequest:
      type: object
      required: [providerCode, providerName, adapterCode]
      properties:
        providerCode:
          type: string
          minLength: 1
          maxLength: 64
          description: 上游供应商唯一编码
        providerName:
          type: string
          minLength: 1
          maxLength: 128
          description: 上游供应商名称
        adapterCode:
          type: string
          minLength: 1
          maxLength: 128
          description: ProviderAdapter实现编码
        status:
          type: string
          enum: [ENABLED, DISABLED]
          default: ENABLED
          description: Provider状态
    Provider:
      type: object
      required: [providerId, providerCode, providerName, adapterCode, status, createdAt, updatedAt]
      properties:
        providerId:
          type: string
          description: 上游供应商ID
        providerCode:
          type: string
          description: 上游供应商唯一编码
        providerName:
          type: string
          description: 上游供应商名称
        adapterCode:
          type: string
          description: ProviderAdapter实现编码
        status:
          type: string
          enum: [ENABLED, DISABLED]
          description: Provider状态
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        updatedAt:
          type: string
          format: date-time
          description: 更新时间
    ProviderResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/Provider'
    ProviderListResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Provider'
    ChannelRequest:
      type: object
      required: [providerId, channelCode, channelName, endpoint, credentialRef]
      properties:
        providerId:
          type: string
          description: 所属上游供应商ID
        channelCode:
          type: string
          minLength: 1
          maxLength: 64
          description: 供应商内唯一渠道编码
        channelName:
          type: string
          minLength: 1
          maxLength: 128
          description: 渠道名称
        endpoint:
          type: string
          format: uri
          maxLength: 512
          description: 上游API端点
        credentialRef:
          type: string
          maxLength: 255
          description: 上游凭证引用；只保存引用，禁止提交或返回凭证明文
        priority:
          type: integer
          default: 0
          description: 路由优先级，数值越小越优先
        weight:
          type: integer
          minimum: 0
          default: 100
          description: 同优先级渠道的路由权重
        status:
          type: string
          enum: [ENABLED, DISABLED]
          default: ENABLED
          description: 渠道状态
    Channel:
      type: object
      required: [channelId, providerId, channelCode, channelName, endpoint, priority, weight, status, version, createdAt, updatedAt]
      properties:
        channelId:
          type: string
          description: 供应商渠道ID
        providerId:
          type: string
          description: 所属上游供应商ID
        channelCode:
          type: string
          description: 供应商内唯一渠道编码
        channelName:
          type: string
          description: 渠道名称
        endpoint:
          type: string
          format: uri
          description: 上游API端点
        credentialRef:
          type: string
          description: 上游凭证引用；不得返回凭证明文
        priority:
          type: integer
          description: 路由优先级
        weight:
          type: integer
          description: 路由权重
        status:
          type: string
          enum: [ENABLED, DISABLED]
          description: 渠道状态
        version:
          type: integer
          format: int64
          description: 乐观锁版本号
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        updatedAt:
          type: string
          format: date-time
          description: 更新时间
    ChannelResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/Channel'
    ChannelListResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Channel'
    ProjectSummary:
      type: object
      properties:
        projectId:
          type: string
          description: 项目ID
        projectCode:
          type: string
          description: 企业内唯一项目编码
        projectName:
          type: string
          description: 项目名称
        entitlementMode:
          type: string
          enum:
          - BALANCE
          - SUBSCRIPTION
          description: 项目唯一权益模式
        status:
          type: string
          description: 项目状态
    ApiKeySummary:
      type: object
      properties:
        apiKeyId:
          type: string
          description: API Key ID
        keyName:
          type: string
          description: Key名称
        keyPrefix:
          type: string
          description: 脱敏展示前缀，不是完整Secret
        status:
          type: string
          enum:
          - ENABLED
          - DISABLED
          - REVOKED
          description: Key状态
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 可选过期时间
    UsageSummary:
      type: object
      properties:
        requestId:
          type: string
          description: AI调用请求ID
        projectId:
          type: string
          description: 项目ID
        model:
          type: string
          description: 逻辑模型编码
        executionResult:
          type: string
          description: 执行结果
        deliveryResult:
          type: string
          description: 交付结果
        billingResult:
          type: string
          description: 计费结果
        createdAt:
          type: string
          format: date-time
          description: 请求时间
    BillingSummary:
      type: object
      properties:
        settlementId:
          type: string
          description: 结算ID
        requestId:
          type: string
          description: 关联AI调用请求ID
        totalCharge:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          description: 币种
        status:
          type: string
          description: 结算状态
