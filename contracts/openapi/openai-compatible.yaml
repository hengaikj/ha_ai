openapi: 3.0.3
info:
  title: 恒爱AI聚合平台 OpenAI-compatible API
  version: 1.0.0-candidate
  description: V1 对企业正式承诺的 OpenAI-compatible API 候选契约。支持模型列表、非流式和流式对话。
servers:
- url: /
  description: 部署环境基础地址由环境配置决定
security:
- BearerAuth: []
paths:
  /v1/models:
    get:
      summary: 获取当前项目可调用模型
      description: 根据企业API Key解析所属项目，只返回该项目Model Policy允许且当前可用的逻辑模型，不暴露Provider、Channel或上游凭证。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          description: API Key无效、禁用、撤销或过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 项目或企业无权调用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/chat/completions:
    post:
      summary: 创建对话补全
      description: OpenAI-compatible 对话接口。平台完成Key鉴权、项目额度检查、模型权限检查、动态路由、Provider调用、Usage/Cost Evidence和结算。stream=true时返回SSE。
      parameters:
      - name: X-Client-Request-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: 可选客户端请求标识；平台始终生成自己的x-request-id用于全链路追踪
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: 成功；响应头包含x-request-id。stream=false返回JSON，stream=true返回text/event-stream
          headers:
            x-request-id:
              description: 平台请求唯一标识
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: OpenAI-compatible SSE数据流
        '400':
          description: 请求参数错误或模型不允许
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API Key认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: 项目权益或额度不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 触发流控
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 上游模型服务错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: 上游模型服务超时
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 企业项目API Key；完整Secret仅创建时展示一次
  schemas:
    Model:
      type: object
      required:
      - id
      - object
      properties:
        id:
          type: string
          description: 平台逻辑模型编码
        object:
          type: string
          example: model
          description: OpenAI-compatible对象类型
        owned_by:
          type: string
          example: ha-ai
          description: 模型服务标识，不暴露实际Provider渠道
    ModelList:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    ChatMessage:
      type: object
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          - tool
          description: 消息角色
        content:
          description: 消息内容；V1以文本对话为正式承诺
          oneOf:
          - type: string
          - type: array
            items:
              type: object
    ChatCompletionRequest:
      type: object
      required:
      - model
      - messages
      properties:
        model:
          type: string
          description: 平台逻辑模型编码，必须在项目Model Policy允许范围内
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
          description: 是否使用SSE流式返回
        temperature:
          type: number
          format: double
          description: 兼容参数；实际支持程度由逻辑模型和Provider能力决定
        top_p:
          type: number
          format: double
          description: 兼容参数
        max_tokens:
          type: integer
          minimum: 1
          description: 兼容最大生成Token参数
        stop:
          description: 停止条件
          oneOf:
          - type: string
          - type: array
            items:
              type: string
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          format: int64
          description: 输入Token数量
        completion_tokens:
          type: integer
          format: int64
          description: 输出Token数量
        total_tokens:
          type: integer
          format: int64
          description: 总Token数量
    ChatCompletionResponse:
      type: object
      required:
      - id
      - object
      - created
      - model
      - choices
      properties:
        id:
          type: string
          description: OpenAI-compatible响应ID
        object:
          type: string
          example: chat.completion
        created:
          type: integer
          format: int64
          description: 响应创建时间戳
        model:
          type: string
          description: 请求使用的平台逻辑模型
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          $ref: '#/components/schemas/Usage'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - message
          - type
          - code
          properties:
            message:
              type: string
              description: 面向调用方的错误说明
            type:
              type: string
              description: 错误类型
            code:
              type: string
              description: 平台规范化错误码
